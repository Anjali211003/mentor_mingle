<div class="home-wrapper">
  <div class="home-card">

    <h1>Welcome to Coaching Platform</h1>
    <p class="subtitle">
      Learn, grow, and connect with experienced coaches
    </p>

    <div class="actions">
      <button class="btn coach" (click)="login('coach')">
        👨‍🏫 Login as Coach
      </button>

      <button class="btn coachee" (click)="login('coachee')">
        🎯 Login as Coachee
      </button>
    </div>

    <div class="divider">
      <span>OR</span>
    </div>

    <button class="btn register" (click)="register()">
      ✨ Create New Account
    </button>

  </div>
</div>
